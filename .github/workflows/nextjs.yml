# Builds the static export and deploys it to GitHub Pages on every push to main.
# basePath and the rest of the export config live in next.config.ts.
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish rather than cancel it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # No static_site_generator here: it writes its own next.config.js,
      # which Next loads in place of next.config.ts.
      - uses: actions/configure-pages@v6.0.0
      # No .next/cache restore: its key never tracked src/ or CSS, and a
      # restored cache shipped CSS from an old globals.css. The build is quick.
      - run: npm ci
      # Either failing stops the deploy. The tests include the setup file
      # fixtures that guard ADR 0001.
      - run: npm run lint
      - run: npm test
      - run: npx --no-install next build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
